<mat-form-field class="w-100" appearance="outline" [class.field-changed]="changedValue">
	<mat-label *ngIf="label != ''">{{label}}</mat-label>
	<input matInput [disabled]="disabled" [matDatepicker]="picker" (focus)="focusOpen(picker)" (click)="picker.open()"
		placeholder="{{ placeholderText }}" [formControl]="fControl">
	<span matSuffix class="changedValue">
		{{changedValue}} 
	</span>
	<mat-datepicker #picker [startView]="startView"></mat-datepicker>
	<mat-error>
		<vmessage [form]="null" [control]="fControl"></vmessage>
	</mat-error>
</mat-form-field>
