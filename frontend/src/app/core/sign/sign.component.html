<div class="row">
    <div class="col-12">
        <signature-pad #signature [options]="signaturePadOptions" (drawStart)="drawStart($event)"
            (drawEnd)="drawComplete($event)"></signature-pad>
    </div>

    <div class="col-12">
        <div class="float-end">
            <button class="btn btn-primary mt-1 me-1" type="button" (click)="clear()" [class.disabled]="disabled">Clear</button>
        </div>
    </div>

</div>
