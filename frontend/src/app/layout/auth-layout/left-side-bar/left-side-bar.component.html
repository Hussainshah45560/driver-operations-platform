<!-- ========== Left Sidebar Start ========== -->
<div class="left-side-menu bg-sidemenu" [class.sidebar-enable]="sideBarStatus | async"
    [class.collapsed]="sidebarCollapsed">
    <div class="h-100 over" data-simplebar>
        <div class="sidebarLogo gap-1">
            <!-- <div class="logo-holder">
                <img src="/assets/logos/horizontalLogo.png" *ngIf="!sidebarCollapsed" alt="CMA Global"
                    class="d-none d-lg-inline-block logo-full">
                <img src="/assets/logos/cmcLogo.png" alt="CMA Global" *ngIf="sidebarCollapsed" class="logo-compact">

            </div> -->
            <div >
                <div class="d-flex align-items-center">
                    <img src="/assets/logos/globe.png" alt="Logo" routerLink="/" type="button"
                        style="width: 30px; height: 30px;" />
                    <p class="fw-semibold text-secondary mb-0 ms-2">Online Application</p>
                </div>

            </div>
            <i class="fa" [ngClass]="sidebarCollapsed ? 'fa-angles-right' : 'fa-angles-left'" (click)="toggleSidebar()"
                type="button"></i>
        </div>
        <button class="btn btn-primary btn-sm mt-2 closeMenu d-lg-none" mat-ripple (click)="closeMenu();">
            <i class="fa-solid fa-xmark"></i>
        </button>


        <div id="sidebar-menu">
            <ul>
                <ng-container *ngFor="let item of navigation">
                    <li>
                        <a routerLink="{{item.url}}" routerLinkActive="active" (click)="closeMenu()"
                            *ngIf="!item.children">
                            <img src="/assets/icons/{{item.icon}}.png" alt="{{item.icon}}">
                            <span>{{item.title}}</span>
                        </a>

                        <a (click)="item.open = !item.open;" class="multiple-items mt-md-4"
                            [class.no-hover]="item.children && item.children.length > 0"
                            *ngIf="item.children && item.children.length > 0">
                            <span>{{item.title}}</span>
                            <hr>
                        </a>
                        <ng-container *ngFor="let subitem of item.children">
                            <a routerLink="{{subitem.url}}" routerLinkActive="active" (click)="closeMenu()">
                                <img src="/assets/icons/{{subitem.icon}}.png" alt="{{subitem.icon}}"
                                    *ngIf="subitem.icon">
                                <span>{{subitem.title}}</span>
                            </a>
                        </ng-container>

                    </li>
                </ng-container>
                <li>
                    <a routerLink="profile" routerLinkActive="active" (click)="closeMenu()">
                        <img src="/assets/icons/myinformation.png" alt="profile">
                        <span>My Profile</span>
                    </a>
                </li>
            </ul>
        </div>
        <div class="userInfo">
            <div class="d-flex align-items-center text-dark">
                <div class="user-image" *ngIf="!sidebarCollapsed">
                    <img [src]="userProfile" onError="this.src='/assets/images/selfie.jpeg'" alt="user-iamge">
                </div>
                <div class="mx-2 flex-grow-1 text-capitalize" *ngIf="!sidebarCollapsed">
                    <h6 class="m-0 ">{{userInfo?.name}}</h6>
                    <small class="fs-12 fw-medium text-grey">{{userInfo?.role.name}}</small>
                </div>
                <i class="fa-solid fa-sign-out float-end bg-info p-2 rounded-circle fs-5" type="button"
                    (click)="logout()"></i>
            </div>
        </div>
        <div class="clearfix">

        </div>
    </div>
</div>
