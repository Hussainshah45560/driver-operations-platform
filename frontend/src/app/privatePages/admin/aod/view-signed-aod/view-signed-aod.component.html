<div class="container p-4 bg-silver">
  <div class="row align-items-baseline">
    <div class="col-12">
      <h4 class="fw-normal fs-4">AOD</h4>
    </div>
  </div>

  <mat-dialog-content class="mat-typography">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="row mt-5">
        <div class="col-12">
          <div class="fw-normal" [innerHtml]="templateData"></div>
        </div>
        <div class="col-md-6">
          <div class="row">
            <div class="col-12">
              <h4>For Admin</h4>
            </div>
            <div class="col-md-10">
              <div class="signature-label">Signature</div>
              <app-sign
                #signPadForDeclaration
                (signature)="patchSign($event, 'admin')"
                [viewSign]="apiData?.signature?.adminSign"
                [disabled]="isDisabled"
              ></app-sign>
            </div>
            <div class="col-md-10">
              <div class="signature-label">Date</div>
              <div class="form-group">
                <app-date-picker
                  placeholderText="Signature Date"
                  label="Signature Date"
                  [fControl]="form.controls['adminSignDate']"
                >
                </app-date-picker>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="row justify-content-end">
            <div class="col-10">
              <h4>For User</h4>
            </div>
            <div class="col-md-10">
              <div class="signature-label">Signature</div>
              <app-sign
                #signPadForDeclaration
                (signature)="patchSign($event, 'user')"
                [viewSign]="apiData?.signature?.userSign"
                [disabled]="isUserDisabled"
              ></app-sign>
            </div>
            <div class="col-md-10">
              <div class="signature-label">Date</div>
              <div class="form-group">
                <app-date-picker
                  placeholderText="Signature Date"
                  label="Signature Date"
                  [fControl]="form.controls['userSignDate']"
                >
                </app-date-picker>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="float-end mt-4">
        <a
          class="btn btn-transparent border-grey fs-14 fw-medium mx-2 rounded-pill"
          (click)="close()"
          type="button"
          >Close</a
        >
        <a
          class="btn btn-secondary fs-14 fw-medium rounded-pill"
          type="button"
          (click)="submit()"
          *ngIf="!isDisabled"
          >Save</a
        >
      </div>
    </form>
  </mat-dialog-content>
</div>
