<div class="container-fluid p-0">
  <div class="row mb-4">
    <div class="col-12 col-md-12 col-lg-12">
      <h4 class="fw-medium text-secondary">Content</h4>
    </div>
  </div>
  <div class="listing-card">
    <div class="card">
      <div class="card-header">
        <div class="searchAndAdd">
          <div class="searchBar">
            <form [formGroup]="searchForm">
              <div class="position-relative">
                <i class="fa fa-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"
                  type="button" (click)="search(searchForm.value.searchTerm)"></i>
                <input type="text" class="form-control ps-5" matInput formControlName="searchTerm"
                  (keydown.enter)="search(searchForm.value.searchTerm)" placeholder="Search content" />
              </div>
            </form>
          </div>
        </div>
      </div>
      <div class="card-body">
        <div class="table-container">
          <table class="table dataTable">
            <thead>
              <tr>
                <th>
                  Title
                  <i class="fa fa-arrow-down ms-1" type="button" (click)="sort('title', -1)"></i>
                  <i class="fa fa-arrow-up ms-1" (click)="sort('title', 1)" type="button"></i>
                </th>
                <th>
                  Heading
                  <i class="fa fa-arrow-down ms-1" type="button" (click)="sort('heading', -1)"></i>
                  <i class="fa fa-arrow-up ms-1" (click)="sort('heading', 1)" type="button"></i>
                </th>
                <!-- <th>Active</th> -->
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              <ng-container *ngFor="let item of dataSource">
                <tr>
                  <td>{{ item?.title }}</td>
                  <td>{{ item?.heading }}</td>
                  <!-- <td>
                  <mat-slide-toggle
                    (change)="updateStatus(item?._id)"
                    [checked]="item?.isActive"
                    color=""
                  ></mat-slide-toggle>
                </td> -->
                  <td>
                    <a class="btn btn-primary bg-transparent text-muted fw-medium rounded-pill mx-2" type="button"
                      routerLink="edit/{{item?._id}}" Permission="content:update">
                      <i class="fa fa-pencil me-1"></i>Edit
                    </a>
                    <a class="btn btn-primary bg-transparent text-muted fw-medium rounded-pill" type="button"
                      (click)="deleteContent(item._id)" Permission="content:delete">
                      <i class="fa fa-trash-can me-1"></i> Delete
                    </a>
                  </td>
                </tr>
              </ng-container>
            </tbody>
          </table>
        </div>
      </div>
      <div class="card-footer">
        <div>
          <pagination [pager]="pager" [params]="queryParams"></pagination>
        </div>
      </div>
    </div>
  </div>
</div>
