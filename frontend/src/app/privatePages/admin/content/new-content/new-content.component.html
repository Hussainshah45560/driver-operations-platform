<div class="row align-items-center">
  <div class="col-12 col-md-6">
    <h4 class="text-secondary fw-medium">Content</h4>
  </div>
  <div class="col-12 col-md-6">
    <div class="d-flex align-items-center float-end">
      <div class="border rounded-pill d-flex align-items-center py-2 px-3">
        <small class="me-3">Content active</small>
        <mat-slide-toggle
          class=""
          (change)="updateStatus(data?._id)"
          [checked]="data?.isActive"
          color=""
        ></mat-slide-toggle>
      </div>
      <span class="border-start mx-2" style="height: 24px"></span>
      <div class="me-2">
        <button
          class="btn btn-info bg-transparent text-dark rounded-pill px-3 py-2 fw-medium w-100 fs-14"
          type="button"
          (click)="goBack()"
        >
          Cancel
        </button>
      </div>
      <div>
        <button
          class="btn btn-primary rounded-pill px-3 py-2 fw-medium w-100 fs-14"
          type="submit"
          (click)="submit()"
        >
          <i class="fa fa-check me-2"></i>Save
        </button>
      </div>
    </div>
  </div>
</div>
<form [formGroup]="form" class="mt-4">
  <div class="row">
    <div class="col-12 col-md-6 col-lg-6">
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Title</mat-label>
          <input
            matInput
            formControlName="title"
            placeholder=" Title"
            type="text"
          />
          <mat-error>
            <vmessage field="title" [control]="form.controls['title']">
            </vmessage>
          </mat-error>
        </mat-form-field>
      </div>
    </div>
    <div class="col-12">
      <div class="form-group">
        <app-text-editor
          placeholderText="Heading"
          [fControl]="form.controls['heading']"
        ></app-text-editor>
        <vmessage
          field="heading"
          [control]="form.controls['heading']"
        ></vmessage>
      </div>
    </div>
    <div class="col-12">
      <div class="form-group">
        <app-text-editor
          placeholderText="Description"
          [fControl]="form.controls['description']"
        ></app-text-editor>
        <vmessage
          field="description"
          [control]="form.controls['description']"
        ></vmessage>
      </div>
    </div>
  </div>
</form>
