<div class="row align-items-center pb-5">
  <div class="col-12 col-md-4 col-lg-4">
    <h4 class="text-secondary fw-medium">Address</h4>
  </div>
  <div class="col-12 col-md-8 col-lg-8">
    <div class="d-flex align-items-center float-md-end">
      <div class="border rounded-pill d-flex align-items-center justify-content-between py-2 px-2 me-1 px-md-3">
        <small class="me-2 me-md-3">Customer Active</small>
        <mat-slide-toggle class="" (change)="updateStatus()" [checked]="stepData?.isActive" [disabled]="!id"
          color=""></mat-slide-toggle>
      </div>
      <span class="border-start mx-2 d-none d-md-block" style="height: 24px"></span>
      <div class="me-2">
        <a class="btn btn-info bg-transparent text-dark rounded-pill px-3 py-2 fw-medium w-100 fs-14 my-3 my-md-0"
          type="button" routerLink="/customers">
          Cancel
        </a>
      </div>
      <div>
        <button class="btn btn-primary rounded-pill px-3 py-2 fw-medium w-100 fs-14" type="button" (click)="submit()">
          <i class="fa fa-check me-2"></i>Save
        </button>
      </div>
    </div>
  </div>
</div>
<form [formGroup]="form" (ngSubmit)="submit()" autocomplete="off">
  <div class="row py-2">
    <div class="col-12 col-md-6 col-lg-6">
      <p class="text-secondary fw-semibold">Your Physical Address</p>
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Street</mat-label>
          <input matInput formControlName="line1" placeholder="Street" type="text"  autocomplete="line1" />

          <mat-error>
            <vmessage field="line1" [control]="form.controls['line1']">
            </vmessage>
          </mat-error>
        </mat-form-field>
      </div>
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Apartment, suite, unit, building (optional)</mat-label>
          <input matInput formControlName="line2" placeholder="Appartment" type="text"   autocomplete="line2"/>

          <mat-error>
            <vmessage field="line2" [control]="form.controls['line2']">
            </vmessage>
          </mat-error>
        </mat-form-field>
      </div>



      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Suburb</mat-label>
          <input matInput formControlName="suburb" placeholder="Suburb" type="text"   autocomplete="suburb"/>
          <mat-error>
            <vmessage field="suburb" [control]="form.controls['suburb']">
            </vmessage>
          </mat-error>
        </mat-form-field>
      </div>

      <div class="form-group">
        <lb-auto-complete appearance="outline" placeholder="Region" label="Region" [multiple]="false" [clear]="false"
          [fControl]="form.controls['regionId']" [options]="selectRegion">
        </lb-auto-complete>
      </div>

      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Postal code</mat-label>
          <input matInput formControlName="zipCode" placeholder="Postal code" type="text"  autocomplete="zipCode" />
          <mat-error>
            <vmessage field="zipCode" [control]="form.controls['zipCode']">
            </vmessage>
          </mat-error>
        </mat-form-field>
      </div>
    </div>
    <div class="col-12 col-md-6 col-lg-6">
      <p class="text-secondary fw-semibold">Postal Address</p>
      <div class="d-flex justify-content-start align-items-center py-2 px-3 mb-20">
        <input class="form-check-input fs-4 rounded-1 m-2" type="checkbox" formControlName="sameAs"
          (change)="sameAs()" />
        <span> Use the same address as physical</span>
      </div>
      <ng-container>
        <div class="form-group">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Street</mat-label>
            <input matInput formControlName="postalline1" placeholder="Street" type="text" autocomplete="postalline1" />
            <mat-error>
              <vmessage field="postalline1" [control]="form.controls['postalline1']">
              </vmessage>
            </mat-error>
          </mat-form-field>
        </div>
        <div class="form-group">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Apartment, suite, unit, building (optional)</mat-label>
            <input matInput formControlName="postalline2" placeholder="Appartment" type="text" autocomplete="postalline2" />

            <mat-error>
              <vmessage field="postalline2" [control]="form.controls['postalline2']">
              </vmessage>
            </mat-error>
          </mat-form-field>
        </div>

        <div class="form-group">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Suburb</mat-label>
            <input matInput formControlName="postalsuburb" placeholder="Suburb" type="text" autocomplete="postalsuburb" />

            <mat-error>
              <vmessage field="postalsuburb" [control]="form.controls['postalsuburb']">
              </vmessage>
            </mat-error>
          </mat-form-field>
        </div>

        <div class="form-group">
          <lb-auto-complete appearance="outline" placeholder="Region" label="Region" [multiple]="false" [clear]="false"
            [fControl]="form.controls['postalregionId']" [options]="selectRegion">
          </lb-auto-complete>
        </div>
        <div class="form-group">
          <mat-form-field class="w-100" appearance="outline">
            <mat-label>Postal code</mat-label>
            <input matInput formControlName="postalzipCode" placeholder="Postal code" type="text" autocomplete="postalzipCode" />

            <mat-error>
              <vmessage field="postalzipCode" [control]="form.controls['postalzipCode']">
              </vmessage>
            </mat-error>
          </mat-form-field>
        </div>
      </ng-container>
    </div>
  </div>
</form>
