<div class="row align-items-center pb-5">
  <div class="col-12 col-md-4 col-lg-4">
    <h4 class="text-secondary fw-medium">Contacts</h4>
  </div>
  <div class="col-12 col-md-8 col-lg-8">
    <div class="d-flex align-items-center float-end">
      <!-- <div class="border rounded-pill d-flex align-items-center justify-content-between py-2 px-2 me-1 px-md-3">
        <small class="me-2 me-md-3">Customer Active</small>
        <mat-slide-toggle class="" (change)="updateStatus()" [checked]="stepData?.isActive" [disabled]="!id"
          color=""></mat-slide-toggle>
      </div> -->
      <span class="border-start mx-2 d-none d-md-block" style="height: 24px"></span>
      <div class="me-2">
        <a class="btn btn-info bg-transparent border-grey text-dark rounded-pill px-3 py-2 fw-medium w-100 fs-14 my-3 my-md-0"
          type="button" routerLink="/customers">
          Cancel
        </a>
      </div>
      <div>
        <button class="btn btn-primary rounded-pill px-3 py-2 fw-medium w-100 fs-14" type="button" (click)="submit()">
          <i class="fa fa-check me-2"></i>Save
        </button>
      </div>
    </div>
  </div>
</div>
<div class="listing-card">
  <div class="card">
    <div class="card-header">
      <div class="searchAndAdd">
        <div class="searchBar">
          <form [formGroup]="searchForm">
            <div class="position-relative">
              <i class="fa fa-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted" type="button"
                (click)="search(searchForm.value.searchTerm)"></i>
              <input type="text" class="form-control ps-5" matInput formControlName="searchTerm"
                (keydown.enter)="search(searchForm.value.searchTerm)" placeholder="Search contact" />
            </div>
          </form>
        </div>
        <div>
          <button class="btn btn-info rounded-button text-secondary px-3 py-2 fw-medium" (click)="newDialog()">
            <small> <i class="fa fa-plus me-2"></i> New Contact</small>
          </button>
        </div>
      </div>
    </div>
    <div class="card-body">
      <table class="table dataTable">
        <thead>
          <tr>
            <th>Default Contact</th>
            <th>
              Name
              <i class="fa fa-arrow-down ms-1" type="button" (click)="sort('name', -1)"></i>
              <i class="fa fa-arrow-up ms-1" (click)="sort('name', 1)" type="button"></i>
            </th>
            <th>
              Email
              <i class="fa fa-arrow-down ms-1" type="button" (click)="sort('email', -1)"></i>
              <i class="fa fa-arrow-up ms-1" (click)="sort('email', 1)" type="button"></i>
            </th>
            <th>
              Cell No.
              <i class="fa fa-arrow-down ms-1" type="button" (click)="sort('phoneNumber', -1)"></i>
              <i class="fa fa-arrow-up ms-1" (click)="sort('phoneNumber', 1)" type="button"></i>
            </th>
            <th>
              Position
              <i class="fa fa-arrow-down ms-1" type="button" (click)="sort('phoneNumber', -1)"></i>
              <i class="fa fa-arrow-up ms-1" (click)="sort('phoneNumber', 1)" type="button"></i>
            </th>
            <th>Active</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <ng-container *ngFor="let item of dataSource">
            <tr>
              <td>
                <mat-radio-button class="readonly-radio" [checked]="item?.isDefault">Default</mat-radio-button>
              </td>
              <td class="text-capitalize">{{item?.name}}</td>
              <td>{{item?.email}}</td>
              <td>{{item?.phoneNumber}}</td>
              <td>{{item?.position}}</td>
              <td>
                <mat-slide-toggle color="" [checked]="item?.isActive"
                  (change)="updateStatus(item?._id)"></mat-slide-toggle>
              </td>
              <td>
                <a class="btn btn-primary bg-transparent text-muted fw-medium rounded-pill mx-2" type="button"
                  (click)="newDialog(item?._id)">
                  <i class="fa fa-pencil me-1"></i>Edit
                </a>
                <a class="btn btn-primary bg-transparent text-muted fw-medium rounded-pill" type="button"
                  (click)="deleteContact(item?._id)">
                  <i class="fa fa-trash-can me-1"></i> Delete
                </a>
              </td>
            </tr>
          </ng-container>
        </tbody>
      </table>
    </div>
    <div class="card-footer">
      <div>
        <pagination [pager]="pager" [params]="queryParams"></pagination>
      </div>
    </div>
  </div>
</div>
