<div class="row align-items-center">
  <div class="col-12 col-md-6">
    <h4 class="text-secondary fw-medium">Email Template</h4>
  </div>
  <div class="col-12 col-md-6">
    <div class="d-flex align-items-center float-end">
      <div class="border rounded-pill d-flex align-items-center py-2 px-3">
        <small class="me-3">Template Active</small>
        <mat-slide-toggle (change)="updateStatus(data?._id)" [checked]="data?.isActive" color=""></mat-slide-toggle>
      </div>
      <span class="border-start mx-2" style="height: 24px"></span>
      <div class="me-2">
        <button class="btn btn-info bg-transparent text-dark rounded-pill px-3 py-2 fw-medium w-100 fs-14"
          routerLink="/emails">
          Cancel
        </button>
      </div>
      <div>
        <button class="btn btn-primary rounded-pill px-3 py-2 fw-medium w-100 fs-14" type="submit" (click)="submit()">
          <i class="fa fa-check me-2"></i>Save
        </button>
      </div>
    </div>
  </div>
</div>
<form [formGroup]="form" class="mt-4">
  <div class="row">
    <div class="col-12 col-md-6 col-lg-6">
      <p class="text-secondary fw-semibold">Information</p>
      <div class="form-group mt-4">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Template name</mat-label>
          <input matInput formControlName="name" placeholder="Template name" type="text" />
          <mat-error>
            <vmessage field="name" [control]="form.controls['name']">
            </vmessage>
          </mat-error>
        </mat-form-field>
      </div>
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Send to</mat-label>
          <input matInput formControlName="sendTo" placeholder="Email address" type="email" />
          <mat-error>
            <vmessage field="sendTo" [control]="form.controls['sendTo']">
            </vmessage>
          </mat-error>
        </mat-form-field>
      </div>
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Subject</mat-label>
          <input matInput formControlName="subject" placeholder="Enter Subject" type="text" />
          <mat-error>
            <vmessage field="subject" [control]="form.controls['subject']">
            </vmessage>
          </mat-error>
        </mat-form-field>
      </div>
      <div class="form-group">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Description</mat-label>
          <input matInput formControlName="description" placeholder="Enter Description" type="text" />
          <mat-error>
            <vmessage field="description" [control]="form.controls['description']">
            </vmessage>
          </mat-error>
        </mat-form-field>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-body">
          <h4 class="mb-0">Fields you can use in template</h4>
          <small>Click on highlighted text to copy it for using in template</small>
          <div class="d-flex mt-3  flex-wrap gap-3">
            <div class="d-flex flex-column" *ngFor="let field of templateFields">
              <p class="mb-0 fs-14">
                {{ field.message }}:
              </p>

              <span class="badge bg-primary fs-6" (click)="copyClipboard(field?.code)" style="cursor: pointer;">
                {{ field.code }}
              </span>
            </div>
          </div>


        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-12 col-md-12 col-lg-12">
      <div class="form-group">
        <app-text-editor placeholderText="Content" [fControl]="form.controls['content']"></app-text-editor>
        <vmessage field="content" [control]="form.controls['content']"></vmessage>
      </div>
    </div>
  </div>
</form>
