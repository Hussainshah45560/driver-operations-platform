<div class="row">
  <div class="col-12">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <p class="fw-medium mb-2 text-secondary">Checklist</p>
      <div class="bg-light rounded p-4">
        <div class="row">
          <div class="col-12 col-md-6 col-lg-6" *ngFor="let item of dataSource">
            <div class="d-flex justify-content-start align-items-center py-2 px-3 fw-normal">
              <mat-checkbox [value]="item?._id" labelPosition="before"  (change)="toggleSelection(item._id, $event.checked)" [checked]="selectedIds.includes(item._id)">
              </mat-checkbox>
              <p class="mb-0">{{item?.name}}</p>
            </div>
          </div>
        </div>

      </div>
      <div class="d-flex align-items-center justify-content-end mt-5">
        <button class="btn btn-transparent rounded-pill py-3 px-5 mx-2 border" type="button" (click)="goBack()">
          Back
        </button>
        <button class="btn btn-primary rounded-pill py-3 px-5" type="submit">
          Next
        </button>
      </div>
    </form>
  </div>
</div>
