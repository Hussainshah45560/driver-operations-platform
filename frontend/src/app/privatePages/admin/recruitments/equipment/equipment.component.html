<div class="listing-card">
    <div class="card" style="border-top-left-radius: 0px; border-top-right-radius: 0px;">
        <div class="card-header">
            <div class="searchAndAdd" style="border-top-left-radius: 0px; border-top-right-radius: 0px;">
                <div class="flex-grow-1">
                    <h4 class="fw-medium text-secondary">Equipment</h4>
                </div>
                <div class="searchBar">
                    <form [formGroup]="searchForm">
                        <div class="position-relative">
                            <i class="fa fa-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"
                                type="button" (click)="search(searchForm.value.searchTerm)"></i>
                            <input type="text" class="form-control ps-5" matInput formControlName="searchTerm"
                                (keydown.enter)="search(searchForm.value.searchTerm)" placeholder="Search Equipment" />
                        </div>
                    </form>
                </div>

            </div>
        </div>
        <div class="card-body">
            <div class="table-container">
                <table class="table dataTable">
                    <thead class="w-100">
                        <tr>
                            <th>
                                Name<i class="fa fa-arrow-down ms-1" type="button" (click)="sort('name', -1)"></i>
                                <i class="fa fa-arrow-up ms-1" (click)="sort('name', 1)" type="button"></i>
                            </th>
                            <th>Equipment
                                <i class="fa fa-arrow-down ms-1" type="button"
                                    (click)="sort('vehicleTypes.name', -1)"></i>
                                <i class="fa fa-arrow-up ms-1" (click)="sort('vehicleTypes.name', 1)" type="button"></i>
                            </th>
                            <th>Status
                                <i class="fa fa-arrow-down ms-1" type="button"
                                    (click)="sort('vehicleTypes.name', -1)"></i>
                                <i class="fa fa-arrow-up ms-1" (click)="sort('vehicleTypes.name', 1)" type="button"></i>
                            </th>
                            <th>Contact No.
                                <i class="fa fa-arrow-down ms-1" type="button"
                                    (click)="sort('vehicleTypes.name', -1)"></i>
                                <i class="fa fa-arrow-up ms-1" (click)="sort('vehicleTypes.name', 1)" type="button"></i>
                            </th>
                            <th>Date Contacted
                                <i class="fa fa-arrow-down ms-1" type="button"
                                    (click)="sort('vehicleTypes.name', -1)"></i>
                                <i class="fa fa-arrow-up ms-1" (click)="sort('vehicleTypes.name', 1)" type="button"></i>
                            </th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let item of dataSource; let i = index">
                            <td>{{ item?.name }}</td>
                            <td>{{ item?.allowEquipments }}</td>
                            <td> <span class="badge rounded-pill  fw-medium text-capitalize"
                                    [style.background]="getColors(item?.status).background"
                                    [style.border]="getColors(item?.status).border"
                                    [style.color]="getColors(item?.status).color">
                                    {{item?.status}}</span></td>
                            <td><a class="btn btn-primary bg-transparent text-muted fw-medium rounded-pill"
                                    href="tel:{{item?.phoneNumber}}" type="button">
                                    <i class="fa fa-phone me-2"></i> {{item?.phoneNumber}}
                                </a></td>
                            <td>{{
                                item.contactedDate
                                ? moment(item.contactedDate).format("DD - MM - YYYY")
                                : "-"
                                }}</td>

                            <td>
                                <a class="btn btn-info text-secondary fw-medium rounded-pill mx-2" type="button"
                                    (click)="generateAod(item?.profileId)" Permission="recruitment:update">
                                    <i class="fa-solid fa-circle-plus me-2"></i>Generate AOD
                                </a>

                                <a class="btn btn-primary bg-transparent text-muted fw-medium rounded-pill mx-2"
                                    type="button"
                                    (click)="newEquipmentPopup(item?.name , item?.phoneNumber , item?.profileId , item?.equipmentId)"
                                    Permission="recruitment:update">
                                    Edit
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer">
            <div>
                <pagination [pager]="pager" [params]="queryParams"></pagination>
            </div>
        </div>
    </div>
</div>
