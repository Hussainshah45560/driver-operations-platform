<div class="container p-4 bg-silver">
  <div class="row align-items-baseline">
    <div class="col-12 col-md-10">
      <h4 class="fw-normal fs-4">References</h4>
    </div>
    <div class="col-md-2">
      <button
        class="btn button-close fs-14 fw-medium mx-2 rounded-circle float-end"
        (click)="close()"
        type="button"
      >
        <i class="fa fa-xmark"></i>
      </button>
    </div>
  </div>
  <mat-dialog-content class="mat-typography">
    <div class="mt-4">
      <ng-container *ngFor="let item of references">
        <div class="row border-bottom py-4">
          <div class="col-md-3">
            <p class="mb-0 fs-12 fw-normal text-muted">Their Name</p>
            <p class="mb-0 fw-normal">{{ item?.referenceName }}</p>
          </div>
          <div class="col-md-5">
            <p class="mb-0 fs-12 fw-normal text-muted">Their Job Title</p>
            <p class="mb-0 fw-normal">{{ item?.referenceDesignation }}</p>
          </div>
          <div class="col-md-4">
            <a
              class="btn btn-primary bg-info text-secondary fw-medium rounded-pill fs-14 float-end"
              href="tel : {{ item?.referenceContact }}"
              type="button"
            >
              <i class="fa fa-phone me-2"></i> {{ item?.referenceContact }}
            </a>
          </div>
        </div>
      </ng-container>
    </div>
  </mat-dialog-content>
</div>
