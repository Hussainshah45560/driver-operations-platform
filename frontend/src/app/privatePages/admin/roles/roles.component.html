<div class="container-fluid p-0">
  <div>
    <!-- sidebar -->
    <div class="componentsSideBar">
      <div class="sidebarHeader">
        <p class="fw-bold text-secondary">Roles</p>
        <button
          class="btn btn-info btn-sm fw-medium rounded-pill text-secondary fw-medium px-3 py-2 fs-14"
          mat-ripple
          (click)="newDialog()"
          type="button"
        >
          <i class="fa fa-add me-1"></i> New Role
        </button>
      </div>
      <div id="componentSteps">
        <ul class="p-0">
          <ng-container *ngFor="let item of dataSource">
            <li class="mb-2">
              <a
                [routerLink]="[item._id]"
                class="d-flex align-items-center gap-3"
                routerLinkActive="active-step"
                [routerLinkActiveOptions]="{ exact: true }"
                routerLink="permissions/{{ item?._id }}"
              >
                <span class="outer">
                  <span class="inner"></span>
                </span>
                <span>{{ item.name }} </span>
              </a>
            </li>
          </ng-container>
        </ul>
      </div>
    </div>
    <!-- forms -->
    <div class="form-content">
      <!--Mobile View-->
      <div class="d-lg-none mb-3 bg-light p-3 rounded-4">
        <div class="sidebarHeader d-flex align-items-center justify-content-between" >
          <p class="fw-bold text-secondary mb-0">Roles</p>
          <button
            class="btn btn-info btn-sm fw-medium rounded-pill text-secondary fw-medium px-3 py-2 fs-14"
            mat-ripple
            (click)="newDialog()"
            type="button"
          >
            <i class="fa fa-add me-1"></i> New Role
          </button>
        </div>
        <div id="componentSteps" class="roles-scroll">
          <ul class="roles-list p-0 m-0">
            <ng-container *ngFor="let item of dataSource">
              <li class="role-item">
                <a
                  [routerLink]="[item._id]"
                  class="d-flex align-items-center gap-2 border-0"
                  routerLinkActive="active-step"
                  [routerLinkActiveOptions]="{ exact: true }"
                  routerLink="permissions/{{ item?._id }}"
                >
                  <span class="outer">
                    <span class="inner"></span>
                  </span>
                  <span>{{ item.name }} </span>
                </a>
              </li>
            </ng-container>
          </ul>
        </div>
      </div>
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
