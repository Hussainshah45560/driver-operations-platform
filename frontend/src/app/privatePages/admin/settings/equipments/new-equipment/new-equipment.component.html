<div class="container p-4 bg-silver">
  <div class="row align-items-baseline">
    <div class="col-12">
      <h4 class="fw-normal fs-4">{{ _id ? "Update" : "Add" }} Equipment</h4>
    </div>
  </div>
  
    <form [formGroup]="form" (ngSubmit)="submit()" class="mt-4">
      <div class="row">
        <div class="col-12">
          <div class="form-group">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Name</mat-label>
              <input
                matInput
                formControlName="name"
                placeholder="Name"
                type="text"
              />
              <mat-error>
                <vmessage field="name" [control]="form.controls['name']">
                </vmessage>
              </mat-error>
            </mat-form-field>
          </div>
        </div>
      </div>
      <div class="float-end mt-4">
        <button
          class="btn btn-transparent fs-14 fw-medium mx-2"
          (click)="close()"
          type="button"
        >
          Cancel
        </button>
        <button
          class="btn btn-secondary text-white fs-14 fw-medium px-3 py-2 rounded-4"
          type="submit"
        >
          {{ _id ? "Update" : "Add" }}
        </button>
      </div>
    </form>
  
</div>
