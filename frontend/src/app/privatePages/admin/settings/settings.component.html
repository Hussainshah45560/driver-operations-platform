<div class="container-fluid p-0">
  <div>
    <!-- sidebar -->
    <div class="componentsSideBar">
      <div class="sidebarHeader">
        <p class="fw-bold text-secondary">Settings</p>
      </div>
      <div id="componentSteps">
        <ul class="p-0">
          <ng-container *ngFor="let item of dataSource; let i = index">
            <li>
              <a
                [routerLink]="[item.value]"
                class="d-flex align-items-center gap-3"
                routerLinkActive="active-step"
                [routerLinkActiveOptions]="{ exact: true }"
              >
                <span class="outer">
                  <span class="inner"></span>
                </span>
                <span>{{ item.name }} </span>
              </a>
            </li>
          </ng-container>
        </ul>
      </div>
    </div>
    <!-- forms -->
    <div class="form-content">
      <!--Mobile View-->
      <div class="d-lg-none mb-3 bg-light p-3 rounded-4">
        <div class="sidebarHeader">
          <p class="fw-bold text-secondary">Settings</p>
        </div>
        <div id="componentSteps" class="roles-scroll">
          <ul class="roles-list p-0 m-0">
            <ng-container *ngFor="let item of dataSource">
              <li class="role-item">
                <a
                  [routerLink]="[item.value]"
                  class="d-flex align-items-center gap-2 border-0"
                  routerLinkActive="active-step"
                  [routerLinkActiveOptions]="{ exact: true }"
                >
                  <span class="outer">
                    <span class="inner"></span>
                  </span>
                  <span>{{ item.name }} </span>
                </a>
              </li>
            </ng-container>
          </ul>
        </div>
      </div>
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
