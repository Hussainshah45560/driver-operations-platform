<div class="container-fluid p-0">
  <div>
    <!-- sidebar -->
    <div class="componentsSideBar">
      <div class="sidebarHeader">
        <p class="fw-bold text-secondary">Template Categories</p>
      </div>
      <div id="componentSteps">
        <ul class="p-0">
          <ng-container *ngFor="let item of dataSource; let i = index">
            <li>
              <a [routerLink]="[]" [queryParams]="{templateTypeId: item?._id}" class="d-flex align-items-center gap-3"
                routerLinkActive="active-step" [routerLinkActiveOptions]="{ exact: true }">
                <span class="outer">
                  <span class="inner"></span>
                </span>
                <span>{{ item.title }} </span>
                <span class="badge rounded-pill bg-primary fw-medium text-capitalize ms-auto">{{item?.count}}</span>
              </a>
            </li>
          </ng-container>
        </ul>
      </div>
    </div>
    <!-- forms -->
    <div class="form-content">
      <!--Mobile View-->
      <div class="d-lg-none mb-3 bg-light p-3 rounded-4">
        <div class="sidebarHeader">
          <p class="fw-bold text-secondary">Template Categories</p>
        </div>
        <div id="componentSteps" class="roles-scroll">
          <ul class="roles-list p-0 m-0">
            <ng-container *ngFor="let item of dataSource">
              <li class="role-item">
                <a [routerLink]="[item.value]" class="d-flex align-items-center gap-2 border-0" [queryParams]="{templateTypeId: item?._id}" 
                  routerLinkActive="active-step" [routerLinkActiveOptions]="{ exact: true }">
                  <span class="outer">
                    <span class="inner"></span>
                  </span>
                  <span>{{ item.title }} </span>
                   <span class="badge rounded-pill bg-primary fw-medium text-capitalize ms-auto">{{item?.count}}</span>
                </a>
              </li>
            </ng-container>
          </ul>
        </div>
      </div>
      <app-details></app-details>
    </div>
  </div>
</div>
