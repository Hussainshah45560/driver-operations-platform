<div class="container p-4 bg-silver">
  <div class="row align-items-baseline">
    <div class="col-12">
      <h4 class="fw-normal fs-4">Change Password</h4>
    </div>
  </div>
  
    <form [formGroup]="form" (ngSubmit)="submit()" class="mt-4">
      <div class="row">
        <div class="col-12">
          <div class="form-group">
            <mat-form-field class="custom-outline w-100" appearance="outline">
              <mat-label>Old Password</mat-label>
              <input
                matInput
                placeholder="Old Passsword"
                formControlName="oldPassword"
                [type]="showOldPassword ? 'text' : 'password'"
              />
              <i
                matSuffix
                (click)="showOldPassword = !showOldPassword"
                class="fa-solid"
                [ngClass]="showOldPassword ? 'fa-eye' : 'fa-eye-slash'"
              ></i>
              <mat-error>
                <vmessage
                  field="oldPassword"
                  [control]="form.controls['oldPassword']"
                >
                </vmessage>
              </mat-error>
            </mat-form-field>
          </div>
        </div>
        <div class="col-12">
          <div class="form-group">
            <mat-form-field class="custom-outline w-100" appearance="outline">
              <mat-label>Password</mat-label>
              <input
                matInput
                placeholder="Passsword"
                formControlName="newPassword"
                [type]="showPassword ? 'text' : 'password'"
              />
              <i
                matSuffix
                (click)="showPassword = !showPassword"
                class="fa-solid"
                [ngClass]="showPassword ? 'fa-eye' : 'fa-eye-slash'"
              ></i>
              <mat-error>
                <vmessage
                  field="newPassword"
                  [control]="form.controls['newPassword']"
                >
                </vmessage>
              </mat-error>
            </mat-form-field>
          </div>
        </div>
        <div class="col-12">
          <div class="form-group">
            <mat-form-field class="custom-outline w-100" appearance="outline">
              <mat-label>Confirm password</mat-label>
              <input
                matInput
                placeholder="Confirm passsword"
                formControlName="confirmPassword"
                [type]="showConfirmPassword ? 'text' : 'password'"
              />
              <i
                matSuffix
                (click)="showConfirmPassword = !showConfirmPassword"
                class="fa-solid"
                [ngClass]="showConfirmPassword ? 'fa-eye' : 'fa-eye-slash'"
              ></i>
              <mat-error>
                <vmessage
                  field="confirmPassword"
                  [control]="form.controls['confirmPassword']"
                >
                </vmessage>
              </mat-error>
            </mat-form-field>
          </div>
        </div>
      </div>
      <div class="float-end mt-4">
        <button
          class="btn btn-transparent fs-14 fw-medium mx-2"
          (click)="close()"
          type="button"
        >
          Cancel
        </button>
        <button
          class="btn btn-secondary text-white fs-14 fw-medium px-3 py-2 rounded-4"
          type="submit"
        >
          Update
        </button>
      </div>
    </form>
  
</div>
