<div class="container-fluid p-0">
  <div class="row mb-4">
    <div class="col-12 col-md-12 col-lg-12">
      <h4 class="fw-medium text-secondary">Contracts</h4>
    </div>
  </div>
  <div class="listing-card">
    <div class="card">
      <div class="card-header">
        <div class="searchAndAdd">
          <div class="searchBar">
            <form [formGroup]="searchForm">
              <div class="position-relative">
                <i class="fa fa-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"
                  type="button" (click)="search(searchForm.value.searchTerm)"></i>
                <input type="text" class="form-control ps-5" matInput formControlName="searchTerm"
                  (keydown.enter)="search(searchForm.value.searchTerm)" placeholder="Search Contracts" />
              </div>
            </form>
          </div>
          <div>
            <!-- <a
              class="btn btn-info rounded-button text-secondary px-3 py-2 fw-medium"
              type="button"
              routerLink="/contracts/new"
              Permission="contracts:add"
            >
              <small> <i class="fa fa-plus me-2"></i> New</small>
            </a> -->
          </div>
        </div>
      </div>
      <div class="card-body">
        <div class="table-container">
          <table class="table dataTable">
            <thead>
              <tr>
                <th>
                  Employer
                  <i class="fa fa-arrow-down ms-1" type="button" (click)="sort('type', -1)"></i>
                  <i class="fa fa-arrow-up ms-1" (click)="sort('type', 1)" type="button"></i>
                </th>
                <th>
                  Start Date
                  <i class="fa fa-arrow-down ms-1" type="button" (click)="sort('date', -1)"></i>
                  <i class="fa fa-arrow-up ms-1" (click)="sort('date', 1)" type="button"></i>
                </th>
                <th>
                  End Date
                  <i class="fa fa-arrow-down ms-1" type="button" (click)="sort('date', -1)"></i>
                  <i class="fa fa-arrow-up ms-1" (click)="sort('date', 1)" type="button"></i>
                </th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <ng-container *ngFor="let item of dataSource">
                <tr>
                  <td>{{item?.employer}}</td>
                  <td> {{
                    item.startDate
                    ? moment(item.startDate).format("DD-MM-YYYY")
                    : "-"
                    }}</td>
                  <td> {{
                    item.endDate
                    ? moment(item.endDate).format("DD-MM-YYYY")
                    : "-"
                    }}</td>
                  <td>
                    <span class="badge rounded-pill fw-medium text-capitalize"
                      [style.background]="getColors(item.status).background"
                      [style.border]="getColors(item.status).border" [style.color]="getColors(item.status).color">
                      {{ item.status }}</span>
                  </td>
                  <td>
                    <a class="btn btn-primary bg-transparent text-muted fw-medium rounded-pill"
                      Permission="contracts:view" routerLink="sign/{{ item?._id }}">
                      View
                    </a>
                    <a class="btn btn-primary bg-transparent text-muted fw-medium rounded-pill ms-2"
                      *ngIf="item?.adminSigned && item?.userSigned"
                      (click)="downloadFile(item?._id, item?.signNowDocumentId!=null ? true : false)" type="button">
                      <i class="fa fa-download"></i>
                    </a>
                    <a class="btn btn-primary bg-transparent text-muted fw-medium rounded-pill ms-2"
                      *ngIf="item?.userInviteLink && !item?.userSigned" [href]="item?.userInviteLink" target="_blank">
                      Sign Now
                    </a>
                    <!-- <a class="btn btn-primary bg-transparent text-muted fw-medium rounded-pill ms-2"
                      *ngIf="item?.signNowDocumentId!=null && item?.status == 'unsigned'"
                      (click)="hireEmployee(item?._id)" type="button">
                      Accept
                    </a> -->
                  </td>
                </tr>
              </ng-container>
            </tbody>
          </table>
        </div>
      </div>
      <div class="card-footer">
        <div>
          <pagination [pager]="pager" [params]="queryParams"></pagination>
        </div>
      </div>
    </div>
  </div>
</div>
