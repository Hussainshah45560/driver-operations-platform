<div class="container-fluid p-0">
  <div class="row mb-4">
    <div class="col-12 col-md-12 col-lg-12">
      <h4 class="fw-medium text-secondary">Tests</h4>
    </div>
  </div>
  <div class="listing-card">
    <div class="card">
      <div class="card-header">
        <div class="searchAndAdd">
          <div class="searchBar">
            <form [formGroup]="searchForm">
              <div class="position-relative">
                <i
                  class="fa fa-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"
                  type="button"
                  (click)="search(searchForm.value.searchTerm)"
                ></i>
                <input
                  type="text"
                  class="form-control ps-5"
                  matInput
                  formControlName="searchTerm"
                  (keydown.enter)="search(searchForm.value.searchTerm)"
                  placeholder="Search Tests"
                />
              </div>
            </form>
          </div>
          <div>
            <ng-container
              *ngIf="['Driver', 'Applicant'].includes(role); else admin"
            >
              <a
                class="btn btn-info rounded-button text-secondary px-3 py-2 fw-medium"
                routerLink="/tests/new"
                Permission="tests:add"
              >
                <small> <i class="fa fa-plus me-2"></i> Book a Test</small>
              </a>
            </ng-container>
            <ng-template #admin>
              <a
                class="btn btn-info rounded-button text-secondary px-3 py-2 fw-medium"
                type="button"
                (click)="chooseEmployee()"
                Permission="tests:add"
              >
                <small> <i class="fa fa-plus me-2"></i> Book a Test</small>
              </a>
            </ng-template>
          </div>
        </div>
      </div>
      <div class="card-body">
        <div class="table-container">
          <table class="table dataTable">
            <thead>
              <tr>
                <th>
                  Time
                  <i
                    class="fa fa-arrow-down ms-1"
                    type="button"
                    (click)="sort('time', -1)"
                  ></i>
                  <i
                    class="fa fa-arrow-up ms-1"
                    (click)="sort('time', 1)"
                    type="button"
                  ></i>
                </th>
                <th>
                  Date
                  <i class="fa fa-arrow-down ms-1" type="button" (click)="sort('date', -1)"></i>
                  <i
                    class="fa fa-arrow-up ms-1"
                    (click)="sort('date', 1)"
                    type="button"
                  ></i>
                </th>
                <th>
                  Name
                  <i
                    class="fa fa-arrow-down ms-1"
                    type="button"
                    (click)="sort('userId', -1)"
                  ></i>
                  <i
                    class="fa fa-arrow-up ms-1"
                    (click)="sort('userId', 1)"
                    type="button"
                  ></i>
                </th>

                <th>
                  Type
                  <i
                    class="fa fa-arrow-down ms-1"
                    type="button"
                    (click)="sort('testTypeId', -1)"
                  ></i>
                  <i
                    class="fa fa-arrow-up ms-1"
                    (click)="sort('testTypeId', 1)"
                    type="button"
                  ></i>
                </th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <ng-container *ngFor="let item of dataSource">
                <tr>
                  <td>
                    {{
                      item?.time
                        ? moment(item?.time, "HH:mm").format("hh:mm A")
                        : "-"
                    }}
                  </td>
                  <td>
                    {{
                      item?.date
                        ? moment(item?.date).format("dddd, D MMM YYYY")
                        : "-"
                    }}
                  </td>
                  <td>{{ item?.name }}</td>
                  <td>{{ item?.testType }}</td>
                  <td>
                    <span
                      class="badge rounded-pill fw-medium text-capitalize"
                      [style.background]="getColors(item.status).background"
                      [style.border]="getColors(item.status).border"
                      [style.color]="getColors(item.status).color"
                    >
                      {{ item.status }}</span
                    >
                  </td>
                  <td>
                    <a
                      class="btn btn-primary bg-transparent text-muted fw-medium rounded-pill me-2"
                      Permission="tests:update"
                      routerLink="edit/{{ item?._id }}"
                    >
                      Edit
                    </a>
                    <a
                      class="btn btn-primary bg-transparent text-muted fw-medium rounded-pill"
                      Permission="tests:view"
                      routerLink="view/{{ item?._id }}"
                    >
                      View
                    </a>
                  </td>
                </tr>
              </ng-container>
            </tbody>
          </table>
        </div>
      </div>
      <div class="card-footer">
        <div>
          <pagination [pager]="pager" [params]="queryParams"></pagination>
        </div>
      </div>
    </div>
  </div>
</div>
