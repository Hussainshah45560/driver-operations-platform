<div class="container-fluid">
  <div class="d-flex align-items-center justify-content-between">
    <div>
      <h4 class="fs-4 text-secondary fw-medium">Vehicle Inspection</h4>
    </div>
    <div class="float-end">
      <a routerLink="/inspection" class="btn btn-transparent border-grey rounded-pill py-2 px-5 me-2">
        Cancel
      </a>
    </div>
  </div>
</div>
<div class="row">
  <div class="col-12">
    <form [formGroup]="form">
      <div class="row mt-3">
        <p class="text-secondary fw-semibold">Vehicle Inspection</p>
        <p class="mb-2 fs-12 text-muted">Vehicle Inspection Complete?</p>

        <div class="col-12 col-md-4 col-lg-4">
          <div class="form-group">
            <app-date-picker placeholderText="Date Completed" label="Date Completed"
              [fControl]="form.controls['testDate']">
            </app-date-picker>
          </div>
        </div>
        <div class="col-12 col-md-4 col-lg-4">
          <div class="form-group">
            <lb-auto-complete appearance="outline" placeholder="Result" label="Result" [multiple]="false"
              [clear]="false" [fControl]="form.controls['testResult']" [options]="selectResult">
            </lb-auto-complete>
          </div>
        </div>
      </div>

      <div class="bg-light rounded-3 p-4">
        <div class="row">
          <div class="col-12 col-md-4 col-lg-4" *ngFor="let item of vehicleCheckList">
            <div class="form-group">
              <p class="text-center fw-medium">{{ item?.name }}</p>

              <div class="row align-items-center">
                <div class="col-3 col-md-3 col-lg-3"></div>
                <div class="col-9 col-md-9 col-lg-9">
                  <div class="row align-items-center">
                    <div class="col-4 col-md-3 col-lg-3 ps-0">
                      <div>
                        <span class="fs-14 fw-medium text-secondary text-center">Good</span>
                      </div>
                    </div>
                    <div class="col-4 col-md-3 col-lg-3 ps-1">
                      <div>
                        <span class="fs-14 fw-medium text-secondary text-center">Fair</span>
                      </div>
                    </div>
                    <div class="col-4 col-md-3 col-lg-3 ps-1">
                      <div>
                        <span class="fs-14 fw-medium text-secondary text-center">Poor</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <ng-container *ngFor="let subItem of item?.groups">
                <div class="row align-items-center">
                  <div class="col-3 col-md-3 col-lg-3">
                    <span class="fw-medium fs-14 text-secondary text-capitalize">{{ subItem?.name }}</span>
                  </div>
                  <div class="col-9 col-md-9 col-lg-9">
                    <mat-radio-group [value]="subItem.selectedValue">
                      <div class="row">
                        <div class="col-4 col-md-3 col-lg-3 p-0" *ngFor="let opt of subItem?.options">
                          <mat-radio-button [value]="opt.name" (click)="isClickable ? null : $event.preventDefault()"
                            (change)="
                              onSubItemChange(item._id, subItem, opt.name)
                            ">
                          </mat-radio-button>
                        </div>
                      </div>
                    </mat-radio-group>
                  </div>
                </div>
              </ng-container>
            </div>
          </div>
        </div>
      </div>

      <hr class="my-5" />
      <hr class="my-4" />
      <div class="row mt-3">
        <div class="col-12 col-md-6 col-lg-6">
          <p class="fs-6 text-primary fw-semibold">Asset Details</p>
          <div class="form-group">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Registration number</mat-label>
              <input matInput formControlName="registrationNumber" placeholder="Registration number" type="text" />

              <mat-error>
                <vmessage field="registrationNumber" [control]="form.controls['registrationNumber']">
                </vmessage>
              </mat-error>
            </mat-form-field>
          </div>
          <div class="form-group">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Make</mat-label>
              <input matInput formControlName="make" placeholder="Make" type="text" />

              <mat-error>
                <vmessage field="make" [control]="form.controls['make']">
                </vmessage>
              </mat-error>
            </mat-form-field>
          </div>
          <div class="form-group">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Model</mat-label>
              <input matInput formControlName="model" placeholder="Model" type="text" />

              <mat-error>
                <vmessage field="model" [control]="form.controls['model']">
                </vmessage>
              </mat-error>
            </mat-form-field>
          </div>
          <div class="form-group">
            <app-date-picker placeholderText="Date of registration" label="Date of registration"
              [fControl]="form.controls['registrationDate']">
            </app-date-picker>
          </div>
          <div class="form-group">
            <app-date-picker placeholderText="License expiry" label="License expiry"
              [fControl]="form.controls['licenseExpiryDate']">
            </app-date-picker>
          </div>
          <div class="form-group">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>How many KM has it done?</mat-label>
              <input matInput formControlName="currentMileage" placeholder="How many KM has it done?" type="number" />

              <mat-error>
                <vmessage field="currentMileage" [control]="form.controls['currentMileage']">
                </vmessage>
              </mat-error>
            </mat-form-field>
          </div>
        </div>
      </div>
