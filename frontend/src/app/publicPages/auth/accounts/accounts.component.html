<div class="container-fluid d-flex background flex-column justify-content-center align-items-center min-vh-100 py-5">
    <div class="custom_820 text-center">
        <div class="text-center">
            <div class="logo-holder ">
                <img src="/assets/logos/cmcLogo.png" alt="CMC Logo">
            </div>
            <!-- <h2 class="text-primary fw-bold my-2">CMC Global</h2> -->
              <h2 class="text-primary fw-bold my-2">Online Application</h2>
        </div>

        <!-- Description Text -->
        <div class="text-muted text-center mb-5 px-3 fs-5 fw-normal" [innerHtml]="description">
            
        </div>
        <div class="row my-5 py-4">
            <div class="col-md-6">
                <div class="card mb-md-0 mb-3">
                    <div class="card-body text-start">
                        <h3 class="fs-3 text-secondary fw-medium">Sign In</h3>
                        <p class="text-muted mb-4 fw-medium">View job applications, next steps, notifications,
                            documents,
                            contracts and more.</p>
                        <button class="btn btn-primary rounded-button  w-100" (click)="goTo('login')">
                            Sign In
                        </button>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body text-start">
                        <h3 class="fs-3 text-secondary fw-medium">Register</h3>
                        <p class="text-muted mb-4 fw-medium">To be able to find, apply and track your job applications,
                            as well as receive notifications.</p>
                        <button class="btn btn-info rounded-button w-100" (click)="goTo('signup')">
                            Register
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <!-- <div class="row">
            <div class="col-md-6 text-center">
               
            </div>
        </div> -->
        <div class="bg-light rounded-pill d-inline-block mx-auto ps-4 pe-2 py-2">
            <small> Are you a Online Application Admin? </small><button
                class="btn btn-info px-3 py-2 ms-2 rounded-pill fw-medium" (click)="goTo('login' , true)"><small>Sign
                    In</small></button>
        </div>
    </div>


</div>

<!-- Background Pattern Image -->
<div class="background-pattern"></div>
