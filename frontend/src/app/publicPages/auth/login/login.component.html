<div class="container-fluid publicPage-background min-vh-100 d-flex flex-column">
  <!-- <div class="publicPage-logo pt-3 ps-3">
    <img src="/assets/logos/horizontalLogo.png" alt="Logo" routerLink="/" type="button"/>
  </div> -->
  <div class="pt-3 ps-3">
    <div class="d-flex align-items-center">
      <img src="/assets/logos/globe.png" alt="Logo" routerLink="/" type="button" style="width: 30px; height: 30px;" />
      <p class="fw-semibold text-secondary mb-0 ms-2">Online Application</p>
    </div>

  </div>
  <div class="flex-grow-1 d-flex justify-content-center align-items-center">
    <div class="col-12 col-lg-4">
      <div class="login-box bg-light p-4 rounded-3 shadow-sm mx-auto">
        <div class="text-center mt-3">
          <!-- <img [src]="isAdmin?'/assets/logos/admin_logo.png':'/assets/logos/login_logo.png'" alt="Logo" class="img-fluid mb-2" /> -->
          <img [src]="isAdmin?'/assets/logos/globe.png':'/assets/logos/globe.png'" alt="Logo" class="img-fluid mb-2" />
          <p class="mb-0 fw-medium">Welcome back to</p>
          <h3 class="text-secondary">Online Application</h3>
        </div>

        <form class="mt-5" [formGroup]="form" (ngSubmit)="submit()">
          <!-- <div class="form-group mb-3" >
            <mat-form-field class="w-100" appearance="outline">
              <input matInput placeholder="Cellphone number" formControlName="phoneNumber" type="tel" [required]="!isAdmin"/>
              <mat-error>
                <vmessage field="phoneNumber" [control]="form.controls['phoneNumber']"></vmessage>
              </mat-error>
            </mat-form-field>
          </div> -->
          <!-- <div class="form-group mb-3" *ngIf="isAdmin"> -->
          <div class="form-group mb-3">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>{{isAdmin?'Admin Email Address':'Cellphone number'}}</mat-label>
              <input matInput placeholder="{{isAdmin?'Admin Email Address':'Cellphone number'}}" formControlName="email"
                type="text" />
              <mat-error>
                <vmessage field="{{isAdmin?'email':'phoneNumber'}}" [control]="form.controls['email']"></vmessage>
              </mat-error>
            </mat-form-field>
          </div>

          <div class="form-group">
            <mat-form-field class="w-100" appearance="outline">
              <mat-label>Password</mat-label>
              <input matInput placeholder="Password" formControlName="password"
                [type]="showPassword ? 'text' : 'password'" />
              <i matSuffix (click)="showPassword = !showPassword" class="fa-solid"
                [ngClass]="showPassword ? 'fa-eye' : 'fa-eye-slash'"></i>
              <mat-error>
                <vmessage field="password" [control]="form.controls['password']"></vmessage>
              </mat-error>
            </mat-form-field>
          </div>
          <div class="mb-3 pb-4 text-start">
            <a (click)="goTo('forgot-password')" type="button" class="text-primary fw-medium fs-12">Forgot Password?</a>
          </div>

          <div class="">
            <button mat-ripple type="submit" class="btn btn-primary w-100 rounded-button">
              Sign In
            </button>
          </div>
          <div class="mt-3">
            <button mat-ripple type="button" class="btn btn-primary w-100 rounded-button bg-transparent text-primary"
              (click)="goTo('signup')">
              Don't have an account?
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
