<div class="container-fluid publicPage-background min-vh-100 d-flex flex-column">
    <!-- <div class="publicPage-logo pt-3 ps-3">
        <img src="/assets/logos/horizontalLogo.png" alt="Logo" routerLink="/" type="button" />
    </div> -->
    <div class="pt-3 ps-3">
        <div class="d-flex align-items-center">
            <img src="/assets/logos/globe.png" alt="Logo" routerLink="/" type="button"
                style="width: 30px; height: 30px;" />
            <p class="fw-semibold text-secondary mb-0 ms-2">Online Application</p>
        </div>

    </div>
    <div class="h-100 publicPage-custom-width mx-auto my-auto">
        <div class="row my-md-0 my-5">
            <div class="col-12 col-lg-6">
                <div>
                    <div class="fw-medium text-primary mb-2" [innerHTML]="heading">
                    </div>
                    <div class="text-muted mb-0 fs-3" [innerHTML]="description">
                    </div>
                </div>
                <div class="mt-5">
                    <div class="d-flex align-items-center">
                        <div>
                            <p class="me-2 mb-0">Remember your password? </p>
                        </div>
                        <div>
                            <button class="btn bg-transparent btn-grey px-3 p-2 fw-medium rounded-pill"
                                (click)="goTo('login')"><small>Sign In Instead</small></button>
                        </div>

                    </div>
                </div>
            </div>

            <div class="col-lg-1 col-0">
            </div>
            <div class="col-12 col-lg-5 mt-lg-0">
                <div class="card">
                    <div class="card-body">
                        <form class="mt-3" [formGroup]="form" (ngSubmit)="submit()">
                            <div class="row">
                                <div class="col-12 col-md-12 mb-4">
                                    <h4 class="fw-medium text-secondary">Create a new password</h4>
                                </div>
                                <div class="col-12">
                                    <div class="form-group mb-3">
                                        <mat-form-field class="custom-outline w-100" appearance="outline">
                                            <mat-label>Password</mat-label>
                                            <input matInput placeholder="Passsword" formControlName="password"
                                                [type]="showPassword ? 'text' : 'password'" />
                                            <i matSuffix (click)="showPassword = !showPassword" class="fa-solid"
                                                [ngClass]="showPassword ? 'fa-eye' : 'fa-eye-slash'"></i>
                                            <mat-error>
                                                <vmessage field="password" [control]="form.controls['password']">
                                                </vmessage>
                                            </mat-error>
                                        </mat-form-field>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="form-group mb-3">
                                        <mat-form-field class="custom-outline w-100" appearance="outline">
                                            <mat-label>Confirm password</mat-label>
                                            <input matInput placeholder="Confirm password"
                                                formControlName="passwordConfirm"
                                                [type]="confirmPasswordShow ? 'text' : 'password'" />
                                            <i matSuffix (click)="confirmPasswordShow = !confirmPasswordShow"
                                                class="fa-solid" [ngClass]="
                        confirmPasswordShow ? 'fa-eye' : 'fa-eye-slash'
                      "></i>
                                            <mat-error>
                                                <vmessage field="passwordConfirm"
                                                    [control]="form.controls['passwordConfirm']">
                                                </vmessage>
                                            </mat-error>
                                        </mat-form-field>
                                    </div>
                                </div>
                            </div>
                            <div class="mt-5">
                                <button type="submit" class="btn btn-primary w-100 rounded-button">
                                    Confirm
                                </button>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
